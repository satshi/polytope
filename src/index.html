<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>4D Polytope Viewer</title>
</head>

<body>
    <div id="status" role="status" aria-live="polite" hidden></div>
    <div id="container">
    <div id="contents">
    </div>
    <div class="head">
    <div class="buttons">
        <label><input type="checkbox" id="ifframe"> Frame</label>
        <select id="series" aria-label="Polytope series">
            <option value="examples">Simple examples</option>
            <option value="5">5-cell series</option>
            <option value="8">8-16-cell series</option>
            <option value="24">24-cell series</option>
            <option value="120">120-600-cell series</option>
            <option value="others">Others</option>
        </select>
        <select id="polytope" aria-label="Polytope">
        </select>
        <button type="button" class="view-button" id="pbtn">View</button>
    </div>
    <div class="buttons">
        &nbsp; Control:
        <button type="button" class="button-on" id="auto" aria-pressed="true">Auto</button>
        <button type="button" class="button-off" id="stop" aria-pressed="false">Stop</button>
        <button type="button" class="button-off" id="3D-rotation" aria-pressed="false">3D move</button>
        <button type="button" class="button-off" id="4D-rotation" aria-pressed="false">4D move</button>
    </div>
    </div>



    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three.module.js"
            }
        }
    </script>
    <script type="module" src="./main.js"></script>
</body>

</html>
